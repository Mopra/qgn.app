<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <style>
    text { font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif; }
  </style>

  <rect width="1200" height="800" fill="#fafafa"/>

  <text x="600" y="45" font-size="14" fill="#999" font-weight="500" letter-spacing="2" text-anchor="middle">LOGO A — SUNBURST</text>

  <!-- ==================== LARGE MARK ==================== -->
  <g transform="translate(200, 80)">
    <!-- Sunburst mark — warm, radiant, Claude-inspired -->
    <g transform="translate(100, 100)">
      <!-- Core circle -->
      <circle cx="0" cy="0" r="18" fill="#E86B47"/>

      <!-- Cardinal rays (longer, thicker) -->
      <line x1="0" y1="-48" x2="0" y2="-28" stroke="#E86B47" stroke-width="9" stroke-linecap="round"/>
      <line x1="0" y1="28" x2="0" y2="48" stroke="#E86B47" stroke-width="9" stroke-linecap="round"/>
      <line x1="-48" y1="0" x2="-28" y2="0" stroke="#E86B47" stroke-width="9" stroke-linecap="round"/>
      <line x1="28" y1="0" x2="48" y2="0" stroke="#E86B47" stroke-width="9" stroke-linecap="round"/>

      <!-- Diagonal rays (shorter, thinner) -->
      <line x1="-35" y1="-35" x2="-22" y2="-22" stroke="#E86B47" stroke-width="6" stroke-linecap="round"/>
      <line x1="22" y1="-22" x2="35" y2="-35" stroke="#E86B47" stroke-width="6" stroke-linecap="round"/>
      <line x1="-35" y1="35" x2="-22" y2="22" stroke="#E86B47" stroke-width="6" stroke-linecap="round"/>
      <line x1="22" y1="22" x2="35" y2="35" stroke="#E86B47" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ==================== LOCKUP: MARK + WORDMARK ==================== -->
  <g transform="translate(100, 340)">
    <!-- Sunburst mark -->
    <g transform="translate(55, 48)">
      <circle cx="0" cy="0" r="12" fill="#E86B47"/>
      <line x1="0" y1="-32" x2="0" y2="-19" stroke="#E86B47" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="19" x2="0" y2="32" stroke="#E86B47" stroke-width="6" stroke-linecap="round"/>
      <line x1="-32" y1="0" x2="-19" y2="0" stroke="#E86B47" stroke-width="6" stroke-linecap="round"/>
      <line x1="19" y1="0" x2="32" y2="0" stroke="#E86B47" stroke-width="6" stroke-linecap="round"/>
      <line x1="-23" y1="-23" x2="-14" y2="-14" stroke="#E86B47" stroke-width="4" stroke-linecap="round"/>
      <line x1="14" y1="-14" x2="23" y2="-23" stroke="#E86B47" stroke-width="4" stroke-linecap="round"/>
      <line x1="-23" y1="23" x2="-14" y2="14" stroke="#E86B47" stroke-width="4" stroke-linecap="round"/>
      <line x1="14" y1="14" x2="23" y2="23" stroke="#E86B47" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- Wordmark -->
    <text x="110" y="42" font-size="46" font-weight="700" fill="#1a1a1a" letter-spacing="-1">Quick Gen</text>
    <text x="110" y="70" font-size="16" font-weight="400" fill="#999" letter-spacing="3">qgn.app</text>
  </g>

  <!-- ==================== FAVICON ==================== -->
  <g transform="translate(520, 340)">
    <text x="28" y="-8" font-size="11" fill="#bbb" font-weight="500" text-anchor="middle">FAVICON</text>
    <rect x="0" y="0" width="56" height="56" rx="12" fill="#E86B47"/>
    <g transform="translate(28, 28)">
      <circle cx="0" cy="0" r="5" fill="#fff"/>
      <line x1="0" y1="-16" x2="0" y2="-9" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="9" x2="0" y2="16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="-16" y1="0" x2="-9" y2="0" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="9" y1="0" x2="16" y2="0" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="-11" y1="-11" x2="-7" y2="-7" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="7" y1="-7" x2="11" y2="-11" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-11" y1="11" x2="-7" y2="7" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="7" y1="7" x2="11" y2="11" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ==================== DARK MODE ==================== -->
  <g transform="translate(100, 500)">
    <text x="0" y="-10" font-size="11" fill="#bbb" font-weight="500" letter-spacing="1">DARK MODE</text>
    <rect x="-20" y="0" width="700" height="110" rx="12" fill="#1a1a1a"/>

    <!-- Mark -->
    <g transform="translate(55, 55)">
      <circle cx="0" cy="0" r="12" fill="#E86B47"/>
      <line x1="0" y1="-32" x2="0" y2="-19" stroke="#E86B47" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="19" x2="0" y2="32" stroke="#E86B47" stroke-width="6" stroke-linecap="round"/>
      <line x1="-32" y1="0" x2="-19" y2="0" stroke="#E86B47" stroke-width="6" stroke-linecap="round"/>
      <line x1="19" y1="0" x2="32" y2="0" stroke="#E86B47" stroke-width="6" stroke-linecap="round"/>
      <line x1="-23" y1="-23" x2="-14" y2="-14" stroke="#E86B47" stroke-width="4" stroke-linecap="round"/>
      <line x1="14" y1="-14" x2="23" y2="-23" stroke="#E86B47" stroke-width="4" stroke-linecap="round"/>
      <line x1="-23" y1="23" x2="-14" y2="14" stroke="#E86B47" stroke-width="4" stroke-linecap="round"/>
      <line x1="14" y1="14" x2="23" y2="23" stroke="#E86B47" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- Wordmark -->
    <text x="110" y="48" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="-1">Quick Gen</text>
    <text x="110" y="76" font-size="16" font-weight="400" fill="#666" letter-spacing="3">qgn.app</text>

    <!-- Dark favicon -->
    <g transform="translate(520, 27)">
      <rect x="0" y="0" width="56" height="56" rx="12" fill="#E86B47"/>
      <g transform="translate(28, 28)">
        <circle cx="0" cy="0" r="5" fill="#fff"/>
        <line x1="0" y1="-16" x2="0" y2="-9" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <line x1="0" y1="9" x2="0" y2="16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <line x1="-16" y1="0" x2="-9" y2="0" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <line x1="9" y1="0" x2="16" y2="0" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <line x1="-11" y1="-11" x2="-7" y2="-7" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="7" y1="-7" x2="11" y2="-11" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="-11" y1="11" x2="-7" y2="7" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="7" y1="7" x2="11" y2="11" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- Color palette -->
  <g transform="translate(100, 700)">
    <text x="0" y="0" font-size="11" fill="#bbb" font-weight="500" letter-spacing="1">PALETTE</text>
    <rect x="0" y="12" width="28" height="28" rx="5" fill="#E86B47"/>
    <text x="36" y="31" font-size="12" fill="#999">#E86B47</text>
    <rect x="110" y="12" width="28" height="28" rx="5" fill="#1a1a1a"/>
    <text x="146" y="31" font-size="12" fill="#999">#1A1A1A</text>
    <rect x="220" y="12" width="28" height="28" rx="5" fill="#fafafa" stroke="#ddd"/>
    <text x="256" y="31" font-size="12" fill="#999">#FAFAFA</text>
  </g>
</svg>