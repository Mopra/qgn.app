<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }

      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        height: 100%;
        background: rgba(24, 24, 24, 0.97);
        backdrop-filter: blur(60px) saturate(1.8);
        -webkit-backdrop-filter: blur(60px) saturate(1.8);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 14px;
        padding: 40px 36px 32px;
        font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui,
          sans-serif;
        -webkit-app-region: drag;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5),
          0 4px 16px rgba(0, 0, 0, 0.3);
        opacity: 0;
        transform: translateY(8px) scale(0.97);
        animation: cardIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.1s
          forwards;
      }

      @keyframes cardIn {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .close-btn {
        -webkit-app-region: no-drag;
        position: absolute;
        top: 12px;
        right: 12px;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        cursor: pointer;
      }

      .close-btn:hover svg {
        stroke: rgba(255, 255, 255, 0.8);
      }

      .close-btn svg {
        width: 10px;
        height: 10px;
        stroke: rgba(255, 255, 255, 0.5);
        stroke-width: 2;
        stroke-linecap: round;
      }

      .icon {
        width: 40px;
        height: 40px;
        margin-bottom: 16px;
      }

      h1 {
        font-size: 20px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.95);
        letter-spacing: -0.01em;
        margin-bottom: 6px;
      }

      .subtitle {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.45);
        margin-bottom: 28px;
      }

      .shortcuts {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        margin-bottom: 32px;
      }

      .shortcut-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
      }

      .shortcut-icon {
        flex-shrink: 0;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 8px;
      }

      .shortcut-icon svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: rgba(255, 255, 255, 0.7);
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .shortcut-text {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .shortcut-label {
        font-size: 13px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.9);
      }

      .shortcut-desc {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.4);
      }

      kbd {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.85);
        white-space: nowrap;
        letter-spacing: 0.02em;
      }

      .btn {
        -webkit-app-region: no-drag;
        width: 100%;
        padding: 10px 0;
        border: none;
        border-radius: 8px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.1s ease;
        background: #af226b;
        color: #fff;
        letter-spacing: 0.01em;
      }

      .btn:hover {
        background: #921c5a;
      }

      .btn:active {
        transform: scale(0.98);
      }

      .hint {
        -webkit-app-region: no-drag;
        margin-top: 14px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.3);
      }

      .hint a {
        color: rgba(255, 255, 255, 0.3);
        text-decoration: underline;
        cursor: pointer;
      }

      .hint a:hover {
        color: rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="close-btn" id="btn-close">
        <svg viewBox="0 0 14 14" fill="none">
          <path d="M1 1l12 12M13 1L1 13" />
        </svg>
      </div>
      <img class="icon" src="icons/icon-128.png" alt="QGN" />
      <div class="shortcuts">
        <div class="shortcut-row">
          <div class="shortcut-icon">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <path d="M3 9h18" />
              <path d="M9 3v18" />
            </svg>
          </div>
          <div class="shortcut-text">
            <span class="shortcut-label">Capture screenshot</span>
            <span class="shortcut-desc"
              >Select an area to copy &amp; save</span
            >
          </div>
          <kbd id="hotkey-capture">Ctrl+Q</kbd>
        </div>

        <div class="shortcut-row">
          <div class="shortcut-icon">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9" />
              <circle cx="12" cy="12" r="4" fill="rgba(255,255,255,0.7)" stroke="none" />
            </svg>
          </div>
          <div class="shortcut-text">
            <span class="shortcut-label">Record screen</span>
            <span class="shortcut-desc">Select an area to record video</span>
          </div>
          <kbd id="hotkey-record">Ctrl+Shift+Q</kbd>
        </div>
      </div>

      <button class="btn" id="btn-go">Got it</button>
      <p class="hint">You can change shortcuts in <a id="link-settings">settings</a></p>
    </div>

    <script>
      function displayAccelerator(accel) {
        return accel
          .replace("CommandOrControl", "Ctrl")
          .replace("CmdOrCtrl", "Ctrl")
          .replace("Control", "Ctrl")
          .replace("Command", "Ctrl")
          .replace(/\+/g, " + ");
      }

      (async () => {
        const hotkeys = await window.welcomeAPI.getHotkeys();
        if (hotkeys.capture)
          document.getElementById("hotkey-capture").textContent =
            displayAccelerator(hotkeys.capture);
        if (hotkeys.record)
          document.getElementById("hotkey-record").textContent =
            displayAccelerator(hotkeys.record);
      })();

      document.getElementById("btn-go").addEventListener("click", () => {
        window.welcomeAPI.close();
      });

      document.getElementById("btn-close").addEventListener("click", () => {
        window.welcomeAPI.close();
      });

      document.getElementById("link-settings").addEventListener("click", () => {
        window.welcomeAPI.openSettings();
      });
    </script>
  </body>
</html>
