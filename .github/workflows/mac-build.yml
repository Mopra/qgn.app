name: Mac build (test)

# Builds the macOS .dmg from any branch without publishing anything, so the
# Mac build can be checked before a [release] commit ships it.
on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks (JS + HTML + package.json)
        run: node scripts/check.js

      - name: Build (Apple Silicon)
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify the app is signed (ad hoc)
        run: codesign --verify --deep --strict --verbose=2 dist/mac-arm64/QGN.app

      - uses: actions/upload-artifact@v4
        with:
          name: QGN-mac-arm64
          path: dist/QGN-mac-arm64.dmg
