name: Check & (opt-in) Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  # Runs on every push to main: fast syntax/JSON validation so a broken main.js
  # can never ship.
  check:
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run checks (JS + HTML + package.json)
        run: node scripts/check.js

  # Only releases when the commit message contains [release]. This keeps routine
  # pushes (docs, refactors) from shipping a build to every auto-updating user.
  bump-and-release:
    needs: check
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && contains(github.event.head_commit.message, '[release]')"

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version, commit, and tag
        run: |
          $NEW_VERSION = npm version patch -m "v%s [skip ci]"
          echo "NEW_VERSION=$NEW_VERSION" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Push version commit and tag
        run: git push origin main --follow-tags

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The body users read on the release page, and what the in-app update
      # card's "What's new" link points at. A missing CHANGELOG entry must not
      # block the release, so the undraft happens either way.
      - name: Publish release (undraft) with notes from CHANGELOG.md
        run: |
          $version = "${{ env.NEW_VERSION }}".TrimStart("v")
          $notes = (node scripts/release-notes.js $version) -join "`n"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($notes)) {
            Write-Host "No CHANGELOG entry for $version; publishing without notes."
            gh release edit ${{ env.NEW_VERSION }} --draft=false --latest
          } else {
            Set-Content -Path release-notes.txt -Value $notes -Encoding utf8
            gh release edit ${{ env.NEW_VERSION }} --draft=false --latest --notes-file release-notes.txt
          }
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
