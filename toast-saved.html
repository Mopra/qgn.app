<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-app-region: no-drag;
      }
      .toast {
        display: inline-flex;
        align-items: center;
        padding: 9px 20px;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(60px) saturate(1.8);
        -webkit-backdrop-filter: blur(60px) saturate(1.8);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 20px;
        font: 13px/1 -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.95);
        letter-spacing: 0.01em;
        opacity: 0;
        transform: translateY(6px) scale(0.96);
        animation: fadeIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                   fadeOut 0.3s ease-in 2.5s forwards;
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.25),
          0 2px 8px rgba(0, 0, 0, 0.15),
          inset 0 0.5px 0 rgba(255, 255, 255, 0.4);
      }
      @keyframes fadeIn {
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes fadeOut {
        to { opacity: 0; transform: translateY(-6px) scale(0.96); }
      }
    </style>
  </head>
  <body>
    <div class="toast">Recording saved</div>
  </body>
</html>
