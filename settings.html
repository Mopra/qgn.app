<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        background: transparent;
        user-select: none;
      }

      /* Subtle: no visible scrollbar, but content stays reachable by wheel. */
      body::-webkit-scrollbar {
        width: 0;
        height: 0;
      }

      .panel {
        background: rgba(30, 30, 30, 0.95);
        backdrop-filter: blur(40px) saturate(1.8);
        -webkit-backdrop-filter: blur(40px) saturate(1.8);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        padding: 8px;
        font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui,
          sans-serif;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),
          0 2px 8px rgba(0, 0, 0, 0.2);
        -webkit-app-region: drag;
      }

      .section-label {
        font-size: 10px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.4);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 6px 10px 4px;
      }

      .item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.85);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: background 0.15s ease;
        -webkit-app-region: no-drag;
      }

      .item:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .item.selected {
        color: #fff;
      }

      .check {
        width: 14px;
        flex-shrink: 0;
        text-align: center;
        font-size: 12px;
      }

      .item-label {
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }

      .separator {
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
        margin: 4px 8px;
      }

      .folder-path {
        font-size: 10px;
        color: rgba(255, 255, 255, 0.35);
        padding: 2px 10px 2px 32px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .toggle {
        position: relative;
        width: 32px;
        height: 18px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.15);
        cursor: pointer;
        transition: background 0.2s ease;
        flex-shrink: 0;
      }

      .toggle.on {
        background: rgba(52, 199, 89, 0.8);
      }

      .toggle-knob {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.2s ease;
      }

      .toggle.on .toggle-knob {
        transform: translateX(14px);
      }

      .hotkey-btn {
        padding: 3px 8px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.7);
        font-family: inherit;
        font-size: 11px;
        cursor: pointer;
        transition: border-color 0.15s ease, background 0.15s ease;
        outline: none;
        flex-shrink: 0;
        -webkit-app-region: no-drag;
      }

      .hotkey-btn:hover {
        border-color: rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.1);
      }

      .hotkey-btn.recording {
        border-color: rgba(59, 130, 246, 0.7);
        background: rgba(59, 130, 246, 0.15);
        color: rgba(59, 130, 246, 0.9);
      }

      .hotkey-btn.error {
        border-color: rgba(255, 91, 80, 0.7);
        background: rgba(255, 91, 80, 0.15);
        color: rgba(255, 130, 120, 0.95);
      }

      /* Compact inline segmented control (quality, dismiss, countdown) */
      .seg {
        display: flex;
        gap: 2px;
        flex-shrink: 0;
        -webkit-app-region: no-drag;
      }

      .seg-btn {
        min-width: 26px;
        height: 22px;
        padding: 0 7px;
        border-radius: 5px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
        color: rgba(255, 255, 255, 0.6);
        font-family: inherit;
        font-size: 11px;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      }

      .seg-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.85);
      }

      .seg-btn.active {
        background: rgba(255, 255, 255, 0.16);
        border-color: rgba(255, 255, 255, 0.25);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="panel" id="panel"></div>
    <script>
      const panel = document.getElementById("panel");
      const formats = ["png", "jpg", "webp", "base64"];

      const hotkeyActions = [
        { key: "capture", label: "Capture" },
        { key: "record", label: "Record" },
      ];

      let currentSettings = null;
      let recordingAction = null;
      let recordingBtn = null;

      // Build a compact inline segmented control: options [{label, value}].
      function makeSegmented(options, current, onPick) {
        const seg = document.createElement("div");
        seg.className = "seg";
        options.forEach((opt) => {
          const b = document.createElement("button");
          b.className = "seg-btn" + (opt.value === current ? " active" : "");
          b.textContent = opt.label;
          b.addEventListener("click", (e) => {
            e.stopPropagation();
            onPick(opt.value);
          });
          seg.appendChild(b);
        });
        return seg;
      }

      function makeOptionRow(labelText, seg) {
        const row = document.createElement("div");
        row.className = "item";
        const label = document.createElement("span");
        label.className = "item-label";
        label.textContent = labelText;
        row.appendChild(label);
        row.appendChild(seg);
        return row;
      }

      function keyToAccelerator(e) {
        const parts = [];
        if (e.ctrlKey || e.metaKey) parts.push("CommandOrControl");
        if (e.altKey) parts.push("Alt");
        if (e.shiftKey) parts.push("Shift");

        const key = e.key;
        if (["Control", "Shift", "Alt", "Meta"].includes(key)) return null;

        const keyMap = {
          " ": "Space",
          ArrowUp: "Up",
          ArrowDown: "Down",
          ArrowLeft: "Left",
          ArrowRight: "Right",
          Delete: "Delete",
          Backspace: "Backspace",
          Enter: "Return",
          Escape: "Escape",
          Tab: "Tab",
        };

        parts.push(keyMap[key] || key.toUpperCase());
        return parts.join("+");
      }

      function displayAccelerator(acc) {
        return acc
          .replace("CommandOrControl", "Ctrl")
          .replace("CmdOrCtrl", "Ctrl")
          .replace(/\+/g, " + ");
      }

      document.addEventListener("keydown", (e) => {
        if (!recordingAction) return;
        e.preventDefault();
        e.stopPropagation();

        if (e.key === "Escape") {
          recordingBtn.classList.remove("recording");
          recordingBtn.textContent = displayAccelerator(
            currentSettings.hotkeys[recordingAction]
          );
          recordingAction = null;
          recordingBtn = null;
          return;
        }

        const acc = keyToAccelerator(e);
        if (!acc) return;

        currentSettings.hotkeys[recordingAction] = acc;
        window.qgnSettings.setHotkey(recordingAction, acc);
        recordingBtn.classList.remove("recording");
        recordingBtn.textContent = displayAccelerator(acc);
        recordingAction = null;
        recordingBtn = null;
      });

      function render(settings) {
        currentSettings = settings;
        // Cancel any in-progress recording on re-render
        recordingAction = null;
        recordingBtn = null;

        panel.innerHTML = "";

        // Copy format section
        const fmtLabel = document.createElement("div");
        fmtLabel.className = "section-label";
        fmtLabel.textContent = "Copy format";
        panel.appendChild(fmtLabel);

        formats.forEach((fmt) => {
          const item = document.createElement("div");
          item.className =
            "item" + (settings.copyFormat === fmt ? " selected" : "");

          const check = document.createElement("span");
          check.className = "check";
          check.textContent = settings.copyFormat === fmt ? "\u2713" : "";

          const label = document.createElement("span");
          label.className = "item-label";
          label.textContent =
            fmt === "base64" ? "Base64 Data URI" : fmt.toUpperCase();

          item.appendChild(check);
          item.appendChild(label);
          item.addEventListener("click", () => {
            settings.copyFormat = fmt;
            window.qgnSettings.setCopyFormat(fmt);
            render(settings);
          });
          panel.appendChild(item);
        });

        // Image quality (JPG/WebP only)
        if (settings.copyFormat === "jpg" || settings.copyFormat === "webp") {
          const qSeg = makeSegmented(
            [
              { label: "70", value: 70 },
              { label: "90", value: 90 },
              { label: "100", value: 100 },
            ],
            settings.imageQuality,
            (v) => {
              settings.imageQuality = v;
              window.qgnSettings.setImageQuality(v);
              render(settings);
            }
          );
          panel.appendChild(makeOptionRow("Quality", qSeg));
        }

        // Separator
        const sep = document.createElement("div");
        sep.className = "separator";
        panel.appendChild(sep);

        // Save to disk toggle
        const saveRow = document.createElement("div");
        saveRow.className = "item";

        const saveLabel = document.createElement("span");
        saveLabel.className = "item-label";
        saveLabel.textContent = "Save to disk";

        const toggle = document.createElement("div");
        toggle.className = "toggle" + (settings.saveToDisk ? " on" : "");
        const knob = document.createElement("div");
        knob.className = "toggle-knob";
        toggle.appendChild(knob);

        saveRow.appendChild(saveLabel);
        saveRow.appendChild(toggle);
        saveRow.addEventListener("click", () => {
          settings.saveToDisk = !settings.saveToDisk;
          window.qgnSettings.setSaveToDisk(settings.saveToDisk);
          render(settings);
        });
        panel.appendChild(saveRow);

        // Save folder (visible when save to disk is on)
        if (settings.saveToDisk) {
          const folderPath = document.createElement("div");
          folderPath.className = "folder-path";
          folderPath.textContent = settings.saveFolder;
          folderPath.title = settings.saveFolder;
          panel.appendChild(folderPath);

          const changeFolder = document.createElement("div");
          changeFolder.className = "item";
          const changeLabel = document.createElement("span");
          changeLabel.className = "item-label";
          changeLabel.textContent = "Change save folder\u2026";
          changeFolder.appendChild(changeLabel);
          changeFolder.addEventListener("click", () => {
            window.qgnSettings.chooseSaveFolder();
          });
          panel.appendChild(changeFolder);

          const openFolder = document.createElement("div");
          openFolder.className = "item";
          const openLabel = document.createElement("span");
          openLabel.className = "item-label";
          openLabel.textContent = "Open save folder";
          openFolder.appendChild(openLabel);
          openFolder.addEventListener("click", () => {
            window.qgnSettings.openSaveFolder();
          });
          panel.appendChild(openFolder);
        }

        // Start on startup toggle
        const startupRow = document.createElement("div");
        startupRow.className = "item";

        const startupLabel = document.createElement("span");
        startupLabel.className = "item-label";
        startupLabel.textContent = "Start on system startup";

        const startupToggle = document.createElement("div");
        startupToggle.className = "toggle" + (settings.startOnStartup ? " on" : "");
        const startupKnob = document.createElement("div");
        startupKnob.className = "toggle-knob";
        startupToggle.appendChild(startupKnob);

        startupRow.appendChild(startupLabel);
        startupRow.appendChild(startupToggle);
        startupRow.addEventListener("click", () => {
          settings.startOnStartup = !settings.startOnStartup;
          window.qgnSettings.setStartOnStartup(settings.startOnStartup);
          render(settings);
        });
        panel.appendChild(startupRow);

        // Behavior separator
        const sepBehav = document.createElement("div");
        sepBehav.className = "separator";
        panel.appendChild(sepBehav);

        // Whether releasing the mouse settles the selection for adjustment or
        // captures immediately (the pre-0.1.17 behaviour).
        const confirmRow = document.createElement("div");
        confirmRow.className = "item";

        const confirmLabel = document.createElement("span");
        confirmLabel.className = "item-label";
        confirmLabel.textContent = "Adjust selection before capture";

        const confirmToggle = document.createElement("div");
        confirmToggle.className = "toggle" + (settings.confirmSelection ? " on" : "");
        const confirmKnob = document.createElement("div");
        confirmKnob.className = "toggle-knob";
        confirmToggle.appendChild(confirmKnob);

        confirmRow.appendChild(confirmLabel);
        confirmRow.appendChild(confirmToggle);
        confirmRow.addEventListener("click", () => {
          settings.confirmSelection = !settings.confirmSelection;
          window.qgnSettings.setConfirmSelection(settings.confirmSelection);
          render(settings);
        });
        panel.appendChild(confirmRow);

        // Recent-capture ring, so a dismissed card is recoverable from the tray.
        const historyRow = document.createElement("div");
        historyRow.className = "item";

        const historyLabel = document.createElement("span");
        historyLabel.className = "item-label";
        historyLabel.textContent = "Keep recent captures";

        const historyToggle = document.createElement("div");
        historyToggle.className = "toggle" + (settings.keepHistory ? " on" : "");
        const historyKnob = document.createElement("div");
        historyKnob.className = "toggle-knob";
        historyToggle.appendChild(historyKnob);

        historyRow.appendChild(historyLabel);
        historyRow.appendChild(historyToggle);
        historyRow.addEventListener("click", () => {
          settings.keepHistory = !settings.keepHistory;
          window.qgnSettings.setKeepHistory(settings.keepHistory);
          render(settings);
        });
        panel.appendChild(historyRow);

        if (settings.keepHistory) {
          const historyNote = document.createElement("div");
          historyNote.className = "folder-path";
          historyNote.textContent = "The last 12 captures stay in the tray menu";
          panel.appendChild(historyNote);
        }

        // Auto-dismiss timer for preview cards (0 = never)
        const dismissSeg = makeSegmented(
          [
            { label: "5s", value: 5 },
            { label: "10s", value: 10 },
            { label: "20s", value: 20 },
            { label: "Never", value: 0 },
          ],
          settings.dismissSeconds,
          (v) => {
            settings.dismissSeconds = v;
            window.qgnSettings.setDismissSeconds(v);
            render(settings);
          }
        );
        panel.appendChild(makeOptionRow("Preview timeout", dismissSeg));

        // Countdown before recording starts (0 = off)
        const countdownSeg = makeSegmented(
          [
            { label: "Off", value: 0 },
            { label: "3s", value: 3 },
          ],
          settings.recordCountdown,
          (v) => {
            settings.recordCountdown = v;
            window.qgnSettings.setRecordCountdown(v);
            render(settings);
          }
        );
        panel.appendChild(makeOptionRow("Record countdown", countdownSeg));

        // Hotkeys section
        const sep2 = document.createElement("div");
        sep2.className = "separator";
        panel.appendChild(sep2);

        const hkLabel = document.createElement("div");
        hkLabel.className = "section-label";
        hkLabel.textContent = "Hotkeys";
        panel.appendChild(hkLabel);

        hotkeyActions.forEach(({ key, label }) => {
          const row = document.createElement("div");
          row.className = "item";

          const rowLabel = document.createElement("span");
          rowLabel.className = "item-label";
          rowLabel.textContent = label;

          const btn = document.createElement("button");
          btn.className = "hotkey-btn";
          btn.textContent = displayAccelerator(settings.hotkeys[key]);
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (recordingBtn) {
              recordingBtn.classList.remove("recording");
              recordingBtn.textContent = displayAccelerator(
                currentSettings.hotkeys[recordingAction]
              );
            }
            recordingAction = key;
            recordingBtn = btn;
            btn.classList.add("recording");
            btn.textContent = "Press keys\u2026";
          });

          row.appendChild(rowLabel);
          row.appendChild(btn);
          panel.appendChild(row);
        });

        // Reset shortcuts to defaults
        const resetRow = document.createElement("div");
        resetRow.className = "item";
        const resetLabel = document.createElement("span");
        resetLabel.className = "item-label";
        resetLabel.textContent = "Reset shortcuts to defaults";
        resetRow.appendChild(resetLabel);
        resetRow.addEventListener("click", () => {
          window.qgnSettings.resetHotkeys();
        });
        panel.appendChild(resetRow);

        // Resize the popover window to fit the rendered content exactly.
        requestAnimationFrame(() => {
          window.qgnSettings.resize(Math.ceil(panel.getBoundingClientRect().height));
        });
      }

      // Surface a rejected hotkey (conflict or invalid) on the active button.
      window.qgnSettings.onHotkeyError((data) => {
        if (recordingBtn && recordingAction === data.action) {
          const btn = recordingBtn;
          const action = recordingAction;
          recordingBtn = null;
          recordingAction = null;
          btn.classList.remove("recording");
          btn.classList.add("error");
          btn.textContent = data.message || "Not allowed";
          setTimeout(() => {
            btn.classList.remove("error");
            if (currentSettings) btn.textContent = displayAccelerator(currentSettings.hotkeys[action]);
          }, 1400);
        }
      });

      window.qgnSettings.getSettings().then(render);
      window.qgnSettings.onUpdated((data) => render(data));
    </script>
  </body>
</html>
