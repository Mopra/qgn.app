<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }

      .dropdown {
        background: rgba(30, 30, 30, 0.95);
        backdrop-filter: blur(40px) saturate(1.8);
        -webkit-backdrop-filter: blur(40px) saturate(1.8);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        padding: 4px;
        font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.4),
          0 2px 8px rgba(0, 0, 0, 0.2);
      }

      .device-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.85);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: background 0.15s ease;
      }

      .device-item:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .device-item.selected {
        color: #fff;
      }

      .check {
        width: 14px;
        flex-shrink: 0;
        text-align: center;
        font-size: 12px;
      }

      .device-label {
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <div class="dropdown" id="dropdown"></div>
    <script>
      const dropdown = document.getElementById("dropdown");
      let permissionGranted = false;

      async function refresh() {
        const selectedMicId = await window.qgnDropdown.getSelectedMicId();

        if (!permissionGranted) {
          try {
            const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            tempStream.getTracks().forEach((t) => t.stop());
            permissionGranted = true;
          } catch (e) { console.warn("Mic permission denied:", e.message); }
        }

        const devices = await navigator.mediaDevices.enumerateDevices();
        const inputs = devices.filter((d) => d.kind === "audioinput");

        dropdown.innerHTML = "";
        inputs.forEach((d) => {
          const item = document.createElement("div");
          item.className = "device-item" + (d.deviceId === selectedMicId ? " selected" : "");

          const check = document.createElement("span");
          check.className = "check";
          check.textContent = d.deviceId === selectedMicId ? "✓" : "";

          const label = document.createElement("span");
          label.className = "device-label";
          label.textContent = d.label || "Unknown device";

          item.appendChild(check);
          item.appendChild(label);
          item.addEventListener("click", () => {
            window.qgnDropdown.selectDevice(d.deviceId);
          });
          dropdown.appendChild(item);
        });
      }

      window.qgnDropdown.onRefresh(() => refresh());
    </script>
  </body>
</html>
