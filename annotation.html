<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        background: #1a1a1a;
        overflow: hidden;
        user-select: none;
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        color: rgba(255, 255, 255, 0.9);
      }
      .container {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* ── Toolbar ── */
      .toolbar {
        height: 48px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        gap: 8px;
        background: rgba(28, 28, 28, 0.98);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        flex-shrink: 0;
        -webkit-app-region: drag;
      }
      .toolbar > * { -webkit-app-region: no-drag; }

      .tool-group { display: flex; gap: 2px; }
      .tool-btn {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: transparent;
        color: rgba(255, 255, 255, 0.6);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.12s, color 0.12s;
      }
      .tool-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.9);
      }
      .tool-btn.active {
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.12);
        color: #fff;
      }
      .tool-btn svg { width: 18px; height: 18px; }

      .sep {
        width: 1px;
        height: 24px;
        background: rgba(255, 255, 255, 0.06);
        margin: 0 4px;
        flex-shrink: 0;
      }

      /* ── Colors ── */
      .colors { display: flex; gap: 5px; align-items: center; }
      .swatch {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
        transition: transform 0.1s, border-color 0.12s;
        flex-shrink: 0;
      }
      .swatch:hover { transform: scale(1.15); }
      .swatch.active { border-color: rgba(255, 255, 255, 0.9); }

      .spacer { flex: 1; height: 100%; -webkit-app-region: drag; }

      /* ── Actions ── */
      .actions { display: flex; gap: 6px; }
      .action-btn {
        height: 30px;
        padding: 0 14px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.85);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.12s;
        letter-spacing: 0.01em;
      }
      .action-btn:hover { background: rgba(255, 255, 255, 0.12); }
      .action-btn.primary { background: #007aff; border-color: #007aff; color: #fff; }
      .action-btn.primary:hover { background: #0062cc; }

      /* ── Canvas ── */
      .canvas-area {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 16px;
      }
      .canvas-wrap {
        position: relative;
        box-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);
        border-radius: 3px;
        overflow: hidden;
        line-height: 0;
      }
      #imageCanvas { display: block; }
      #drawCanvas {
        position: absolute;
        top: 0;
        left: 0;
        cursor: crosshair;
      }

      /* ── Text input overlay ── */
      .text-input {
        position: absolute;
        background: transparent;
        border: 1px dashed rgba(255, 255, 255, 0.4);
        outline: none;
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        font-weight: 600;
        padding: 2px 4px;
        min-width: 20px;
        z-index: 10;
      }

      /* ── Size pickers (text + redact) ── */
      .size-picker, .pixel-picker, .redact-style {
        display: none;
        gap: 2px;
      }
      .size-picker.visible, .pixel-picker.visible, .redact-style.visible { display: flex; }
      .size-btn, .pixel-btn {
        height: 34px;
        padding: 0 8px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: transparent;
        color: rgba(255, 255, 255, 0.6);
        cursor: pointer;
        font-weight: 600;
        transition: background 0.12s, color 0.12s;
      }
      .size-btn:hover, .pixel-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.9);
      }
      .size-btn.active, .pixel-btn.active {
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.12);
        color: #fff;
      }

      /* ── Shape dropdown ── */
      .shape-wrapper {
        position: relative;
      }
      .shape-btn {
        width: 44px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: transparent;
        color: rgba(255, 255, 255, 0.6);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.12s, color 0.12s;
        gap: 2px;
      }
      .shape-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.9);
      }
      .shape-btn.active {
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.12);
        color: #fff;
      }
      .shape-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
      .shape-caret {
        width: 0;
        height: 0;
        border-left: 3.5px solid transparent;
        border-right: 3.5px solid transparent;
        border-top: 4px solid rgba(255, 255, 255, 0.4);
        margin-left: 2px;
        flex-shrink: 0;
      }
      .shape-dropdown {
        display: none;
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        margin-top: 6px;
        background: rgba(36, 36, 36, 0.98);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 4px;
        gap: 2px;
        z-index: 20;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      }
      .shape-dropdown.open { display: flex; }
      .shape-option {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: transparent;
        color: rgba(255, 255, 255, 0.6);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.12s, color 0.12s;
      }
      .shape-option:hover {
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.9);
      }
      .shape-option.active {
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.12);
        color: #fff;
      }
      .shape-option svg { width: 18px; height: 18px; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="toolbar">
        <div class="tool-group">
          <button class="tool-btn active" data-tool="draw" title="Draw (D)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.83 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
          </button>
          <button class="tool-btn" data-tool="arrow" title="Arrow (A)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="10 5 19 5 19 14"/></svg>
          </button>
          <div class="shape-wrapper">
            <button class="shape-btn" id="shapeBtn" title="Shape (S)">
              <svg id="shapeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
              <span class="shape-caret"></span>
            </button>
            <div class="shape-dropdown" id="shapeDropdown">
              <button class="shape-option active" data-shape="rect" title="Rectangle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
              </button>
              <button class="shape-option" data-shape="ellipse" title="Ellipse">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg>
              </button>
              <button class="shape-option" data-shape="diamond" title="Diamond">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2, 22 12, 12 22, 2 12"/></svg>
              </button>
              <button class="shape-option" data-shape="line" title="Line">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="20" y2="4"/></svg>
              </button>
            </div>
          </div>
          <button class="tool-btn" data-tool="text" title="Text (T)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9.5" y1="20" x2="14.5" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
          </button>
          <button class="tool-btn" data-tool="redact" title="Redact (X)">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
          </button>
          <button class="tool-btn" data-tool="callout" title="Callout (C)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><text x="12" y="16" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" font-weight="700">1</text></svg>
          </button>
          <button class="tool-btn" data-tool="cursor" title="Cursor (P)">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M5 2 L5 19 L8.7 15.3 L11 20.4 L13.1 19.5 L10.7 14.5 L15.5 14.5 Z"/></svg>
          </button>
          <button class="tool-btn" data-tool="crop" title="Crop (R)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M2 6h14a2 2 0 0 1 2 2v14"/></svg>
          </button>
        </div>

        <div class="sep"></div>

        <button class="tool-btn" id="undoBtn" title="Undo (Ctrl+Z)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
        </button>
        <button class="tool-btn" id="redoBtn" title="Redo (Ctrl+Y)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.13-9.36L23 10"/></svg>
        </button>

        <div class="sep"></div>

        <div class="colors">
          <div class="swatch active" data-color="#ff3b30" style="background:#ff3b30"></div>
          <div class="swatch" data-color="#ff9500" style="background:#ff9500"></div>
          <div class="swatch" data-color="#ffcc00" style="background:#ffcc00"></div>
          <div class="swatch" data-color="#34c759" style="background:#34c759"></div>
          <div class="swatch" data-color="#007aff" style="background:#007aff"></div>
          <div class="swatch" data-color="#ffffff" style="background:#ffffff;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.2)"></div>
        </div>

        <div class="sep"></div>

        <div class="size-picker" id="sizePicker">
          <button class="size-btn" data-size="S" style="font-size:11px" title="Small text">S</button>
          <button class="size-btn active" data-size="M" style="font-size:13px" title="Medium text">M</button>
          <button class="size-btn" data-size="L" style="font-size:15px" title="Large text">L</button>
        </div>

        <div class="redact-style" id="redactStyle">
          <button class="size-btn active" data-redact="solid" style="font-size:12px" title="Solid block (safest)">Block</button>
          <button class="size-btn" data-redact="pixelate" style="font-size:12px" title="Pixelate">Pixel</button>
        </div>

        <div class="pixel-picker" id="pixelPicker">
          <button class="pixel-btn" data-pixel="S" style="font-size:11px" title="Fine pixels">S</button>
          <button class="pixel-btn active" data-pixel="M" style="font-size:13px" title="Medium pixels">M</button>
          <button class="pixel-btn" data-pixel="L" style="font-size:15px" title="Heavy pixels">L</button>
        </div>

        <div class="spacer"></div>

        <div class="actions">
          <button class="action-btn" id="cancelBtn">Cancel</button>
          <button class="action-btn primary" id="doneBtn">Done</button>
        </div>
      </div>

      <div class="canvas-area" id="canvasArea">
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="imageCanvas"></canvas>
          <canvas id="drawCanvas"></canvas>
        </div>
      </div>
    </div>

    <script>
      const imageCanvas = document.getElementById("imageCanvas");
      const drawCanvas = document.getElementById("drawCanvas");
      const imgCtx = imageCanvas.getContext("2d");
      const drawCtx = drawCanvas.getContext("2d");
      const canvasArea = document.getElementById("canvasArea");

      const img = new Image();
      const MAX_STROKES = 500;
      let tool = "draw";
      let shapeType = "rect"; // rect, ellipse, diamond, line
      let color = "#ff3b30";
      let strokeBaseWidth = 3;
      let strokes = [];
      let redoStack = [];
      let currentStroke = null;
      let isDrawing = false;
      let textSize = "M"; // S, M, L
      let pixelSize = "M"; // S, M, L
      let redactStyle = "solid"; // solid | pixelate
      let calloutCounter = 1;
      const textSizeMap = { S: 14, M: 20, L: 30 }; // base font sizes in display pixels
      const pixelSizeMap = { S: 6, M: 12, L: 24 }; // pixel block size in display pixels
      const sizePicker = document.getElementById("sizePicker");
      const pixelPicker = document.getElementById("pixelPicker");
      const redactStyleGroup = document.getElementById("redactStyle");
      const shapeTools = new Set(["rect", "ellipse", "diamond", "line"]);

      /* ── Shape dropdown ── */
      const shapeBtn = document.getElementById("shapeBtn");
      const shapeDropdown = document.getElementById("shapeDropdown");
      const shapeIcon = document.getElementById("shapeIcon");

      const shapeIcons = {
        rect: '<rect x="3" y="3" width="18" height="18" rx="2"/>',
        ellipse: '<ellipse cx="12" cy="12" rx="9" ry="7"/>',
        diamond: '<polygon points="12 2, 22 12, 12 22, 2 12"/>',
        line: '<line x1="4" y1="20" x2="20" y2="4"/>',
      };

      shapeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (shapeTools.has(tool)) {
          shapeDropdown.classList.toggle("open");
        } else {
          selectTool(shapeType);
          shapeDropdown.classList.remove("open");
        }
      });

      document.querySelectorAll("[data-shape]").forEach((opt) => {
        opt.addEventListener("click", (e) => {
          e.stopPropagation();
          document.querySelector("[data-shape].active").classList.remove("active");
          opt.classList.add("active");
          shapeType = opt.dataset.shape;
          shapeIcon.innerHTML = shapeIcons[shapeType];
          shapeDropdown.classList.remove("open");
          selectTool(shapeType);
        });
      });

      document.addEventListener("click", () => {
        shapeDropdown.classList.remove("open");
      });

      /* ── Tool selection ── */
      function clearActiveTools() {
        document.querySelectorAll("[data-tool].active").forEach((b) => b.classList.remove("active"));
        shapeBtn.classList.remove("active");
      }

      // Show only the option picker(s) relevant to the active tool.
      function updateOptionPickers() {
        sizePicker.classList.toggle("visible", tool === "text");
        redactStyleGroup.classList.toggle("visible", tool === "redact");
        pixelPicker.classList.toggle("visible", tool === "redact" && redactStyle === "pixelate");
      }

      document.querySelectorAll("[data-tool]").forEach((btn) => {
        btn.addEventListener("click", () => {
          clearActiveTools();
          btn.classList.add("active");
          tool = btn.dataset.tool;
          updateOptionPickers();
          shapeDropdown.classList.remove("open");
        });
      });

      function selectTool(t) {
        tool = t;
        clearActiveTools();
        if (shapeTools.has(t)) {
          shapeBtn.classList.add("active");
        } else {
          const btn = document.querySelector(`[data-tool="${t}"]`);
          if (btn) btn.classList.add("active");
        }
        updateOptionPickers();
      }

      /* ── Text size selection ── */
      document.querySelectorAll("[data-size]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelector("[data-size].active").classList.remove("active");
          btn.classList.add("active");
          textSize = btn.dataset.size;
        });
      });

      /* ── Pixel size selection ── */
      document.querySelectorAll("[data-pixel]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelector("[data-pixel].active").classList.remove("active");
          btn.classList.add("active");
          pixelSize = btn.dataset.pixel;
        });
      });

      /* ── Redaction style selection (solid block vs pixelate) ── */
      document.querySelectorAll("[data-redact]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelector("[data-redact].active").classList.remove("active");
          btn.classList.add("active");
          redactStyle = btn.dataset.redact;
          updateOptionPickers();
        });
      });

      /* ── Color selection ── */
      document.querySelectorAll(".swatch").forEach((sw) => {
        sw.addEventListener("click", () => {
          document.querySelector(".swatch.active").classList.remove("active");
          sw.classList.add("active");
          color = sw.dataset.color;
        });
      });

      /* ── Undo / Redo ── */
      // All newly committed strokes go through addStroke so the redo stack is
      // invalidated whenever the user draws something new after undoing.
      function addStroke(s) {
        strokes.push(s);
        redoStack = [];
      }
      function undo() {
        if (strokes.length === 0) return;
        const removed = strokes.pop();
        if (removed.type === "callout") calloutCounter--;
        redoStack.push(removed);
        renderDrawCanvas();
      }
      function redo() {
        if (redoStack.length === 0) return;
        const restored = redoStack.pop();
        if (restored.type === "callout") calloutCounter++;
        strokes.push(restored);
        renderDrawCanvas();
      }
      document.getElementById("undoBtn").addEventListener("click", undo);
      document.getElementById("redoBtn").addEventListener("click", redo);

      /* ── Cancel / Done ── */
      document.getElementById("cancelBtn").addEventListener("click", () => window.annotate.cancel());
      document.getElementById("doneBtn").addEventListener("click", save);

      /* ── Keyboard shortcuts ── */
      document.addEventListener("keydown", (e) => {
        // Don't intercept keys when typing in text input
        if (e.target.classList.contains("text-input")) return;
        if (e.key === "Escape") { window.annotate.cancel(); return; }
        const mod = e.ctrlKey || e.metaKey;
        // Redo: Ctrl+Y or Ctrl+Shift+Z
        if (mod && (e.key === "y" || e.key === "Y" || ((e.key === "z" || e.key === "Z") && e.shiftKey))) {
          e.preventDefault(); redo(); return;
        }
        if (mod && (e.key === "z" || e.key === "Z")) { e.preventDefault(); undo(); return; }
        if (e.key === "d") selectTool("draw");
        if (e.key === "a") selectTool("arrow");
        if (e.key === "s") selectTool(shapeType);
        if (e.key === "t") selectTool("text");
        if (e.key === "x") selectTool("redact");
        if (e.key === "c") selectTool("callout");
        if (e.key === "p") selectTool("cursor");
        if (e.key === "r") selectTool("crop");
      });

      /* ── Canvas coordinates (display-pixel space) ── */
      function canvasCoords(e) {
        const rect = drawCanvas.getBoundingClientRect();
        return {
          x: e.clientX - rect.left,
          y: e.clientY - rect.top,
        };
      }

      /* ── Text input helper ── */
      function spawnTextInput(pt) {
        const wrap = document.getElementById("canvasWrap");
        const input = document.createElement("input");
        input.type = "text";
        input.className = "text-input";
        const fontSize = textSizeMap[textSize];
        input.style.left = pt.x + "px";
        input.style.top = (pt.y - fontSize / 2) + "px";
        input.style.fontSize = fontSize + "px";
        input.style.color = color;
        input.dataset.ptX = pt.x;
        input.dataset.ptY = pt.y;
        input.dataset.size = textSize;
        input.dataset.color = color;
        wrap.appendChild(input);
        input.focus();

        function commit() {
          const text = input.value.trim();
          if (text) {
            addStroke({
              type: "text",
              text,
              pos: { x: parseFloat(input.dataset.ptX), y: parseFloat(input.dataset.ptY) },
              color: input.dataset.color,
              size: input.dataset.size,
            });
            renderDrawCanvas();
          }
          input.remove();
        }

        let cancelled = false;
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); commit(); }
          if (e.key === "Escape") { e.preventDefault(); cancelled = true; input.remove(); }
          e.stopPropagation();
        });
        input.addEventListener("blur", () => { if (!cancelled) commit(); });
      }

      /* ── Pointer events ── */
      drawCanvas.addEventListener("pointerdown", (e) => {
        const pt = canvasCoords(e);

        if (tool === "text") {
          spawnTextInput(pt);
          return;
        }

        if (tool === "callout") {
          addStroke({
            type: "callout",
            pos: pt,
            number: calloutCounter++,
            color,
          });
          renderDrawCanvas();
          return;
        }

        if (tool === "cursor") {
          // Click to drop a cursor; its tip (hotspot) sits at the click point.
          if (strokes.length < MAX_STROKES) {
            addStroke({ type: "cursor", pos: pt });
            renderDrawCanvas();
          }
          return;
        }

        isDrawing = true;
        drawCanvas.setPointerCapture(e.pointerId);

        if (tool === "draw") {
          currentStroke = { type: "draw", points: [pt], color, width: strokeBaseWidth };
        } else if (tool === "arrow") {
          currentStroke = { type: "arrow", from: pt, to: { ...pt }, color, width: strokeBaseWidth };
        } else if (shapeTools.has(tool)) {
          currentStroke = { type: tool, from: pt, to: { ...pt }, color, width: strokeBaseWidth };
        } else if (tool === "redact") {
          currentStroke = { type: "redact", from: pt, to: { ...pt }, pixelSize, style: redactStyle };
        } else if (tool === "crop") {
          currentStroke = { type: "cropsel", from: pt, to: { ...pt } };
        }
      });

      drawCanvas.addEventListener("pointermove", (e) => {
        if (!isDrawing || !currentStroke) return;
        const pt = canvasCoords(e);

        if (currentStroke.type === "draw") {
          // Incremental draw — fast for freehand
          const prev = currentStroke.points[currentStroke.points.length - 1];
          drawCtx.strokeStyle = currentStroke.color;
          drawCtx.lineWidth = currentStroke.width;
          drawCtx.lineCap = "round";
          drawCtx.lineJoin = "round";
          drawCtx.beginPath();
          drawCtx.moveTo(prev.x, prev.y);
          drawCtx.lineTo(pt.x, pt.y);
          drawCtx.stroke();
          currentStroke.points.push(pt);
        } else {
          // Shape tools: redraw all on each move
          currentStroke.to = pt;
          renderDrawCanvas();
        }
      });

      drawCanvas.addEventListener("pointerup", () => {
        // Crop commits immediately (it's not a saved stroke).
        if (currentStroke && currentStroke.type === "cropsel") {
          const sel = currentStroke;
          currentStroke = null;
          isDrawing = false;
          performCrop(sel);
          return;
        }
        if (currentStroke) {
          // Only save strokes with meaningful content
          let dominated;
          if (currentStroke.type === "draw") {
            dominated = currentStroke.points.length >= 2;
          } else if (currentStroke.from && currentStroke.to) {
            dominated = Math.abs(currentStroke.to.x - currentStroke.from.x) > 2 ||
              Math.abs(currentStroke.to.y - currentStroke.from.y) > 2;
          }
          if (dominated && strokes.length < MAX_STROKES) addStroke(currentStroke);
          currentStroke = null;
        }
        isDrawing = false;
      });

      /* ── Rendering ── */
      function renderDrawCanvas() {
        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        const all = currentStroke ? [...strokes, currentStroke] : strokes;
        for (const s of all) {
          drawStrokeOnCtx(drawCtx, s, 1, 1);
        }
      }

      function drawStrokeOnCtx(ctx, stroke, sx, sy) {
        if (stroke.type === "cropsel") {
          // Live crop selection: dim outside + dashed border (never saved).
          const x = Math.min(stroke.from.x, stroke.to.x) * sx;
          const y = Math.min(stroke.from.y, stroke.to.y) * sy;
          const w = Math.abs(stroke.to.x - stroke.from.x) * sx;
          const h = Math.abs(stroke.to.y - stroke.from.y) * sy;
          ctx.save();
          ctx.fillStyle = "rgba(0,0,0,0.45)";
          ctx.fillRect(0, 0, drawCanvas.width, y);
          ctx.fillRect(0, y + h, drawCanvas.width, drawCanvas.height - (y + h));
          ctx.fillRect(0, y, x, h);
          ctx.fillRect(x + w, y, drawCanvas.width - (x + w), h);
          ctx.strokeStyle = "rgba(255,255,255,0.95)";
          ctx.lineWidth = 1.5;
          ctx.setLineDash([5, 4]);
          ctx.strokeRect(x + 0.5, y + 0.5, Math.max(0, w - 1), Math.max(0, h - 1));
          ctx.restore();
          return;
        }

        if (stroke.type === "text") {
          const fontSize = textSizeMap[stroke.size] * sx;
          ctx.font = `600 ${fontSize}px -apple-system, "Segoe UI", system-ui, sans-serif`;
          ctx.fillStyle = stroke.color;
          ctx.textBaseline = "middle";
          ctx.fillText(stroke.text, stroke.pos.x * sx, stroke.pos.y * sy);
          return;
        }

        if (stroke.type === "redact") {
          const x = Math.min(stroke.from.x, stroke.to.x) * sx;
          const y = Math.min(stroke.from.y, stroke.to.y) * sy;
          const w = Math.abs(stroke.to.x - stroke.from.x) * sx;
          const h = Math.abs(stroke.to.y - stroke.from.y) * sy;
          if (w < 1 || h < 1) return;

          // Solid block: opaque and unrecoverable (the safe default).
          if (stroke.style === "solid") {
            ctx.fillStyle = "#000";
            ctx.fillRect(x, y, w, h);
            return;
          }

          // Source region on the original image (always in natural-pixel coords)
          const imgRX = img.naturalWidth / drawCanvas.width;
          const imgRY = img.naturalHeight / drawCanvas.height;
          const srcX = Math.min(stroke.from.x, stroke.to.x) * imgRX;
          const srcY = Math.min(stroke.from.y, stroke.to.y) * imgRY;
          const srcW = Math.abs(stroke.to.x - stroke.from.x) * imgRX;
          const srcH = Math.abs(stroke.to.y - stroke.from.y) * imgRY;

          // Pixel block size scaled to output resolution
          const block = (pixelSizeMap[stroke.pixelSize] || 12) * sx;
          const cols = Math.max(1, Math.ceil(w / block));
          const rows = Math.max(1, Math.ceil(h / block));

          // Sample region from original image at reduced resolution
          const tmp = document.createElement("canvas");
          tmp.width = cols;
          tmp.height = rows;
          const tmpCtx = tmp.getContext("2d");
          tmpCtx.drawImage(img, srcX, srcY, srcW, srcH, 0, 0, cols, rows);

          // Draw back scaled up with no smoothing for blocky pixels
          const prevSmoothing = ctx.imageSmoothingEnabled;
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(tmp, 0, 0, cols, rows, x, y, w, h);
          ctx.imageSmoothingEnabled = prevSmoothing;
          return;
        }

        if (stroke.type === "callout") {
          const radius = 14 * sx;
          const cx = stroke.pos.x * sx;
          const cy = stroke.pos.y * sy;
          // Filled circle
          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, Math.PI * 2);
          ctx.fillStyle = stroke.color;
          ctx.fill();
          // Number
          const numSize = Math.round(radius * 1.2);
          ctx.font = `700 ${numSize}px -apple-system, "Segoe UI", system-ui, sans-serif`;
          ctx.fillStyle = "#fff";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(String(stroke.number), cx, cy);
          ctx.textAlign = "start"; // reset
          return;
        }

        if (stroke.type === "cursor") {
          drawCursor(ctx, stroke.pos.x * sx, stroke.pos.y * sy, sx);
          return;
        }

        ctx.strokeStyle = stroke.color;
        ctx.lineWidth = stroke.width * sx;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        if (stroke.type === "draw") {
          if (stroke.points.length < 2) return;
          ctx.beginPath();
          ctx.moveTo(stroke.points[0].x * sx, stroke.points[0].y * sy);
          for (let i = 1; i < stroke.points.length; i++) {
            ctx.lineTo(stroke.points[i].x * sx, stroke.points[i].y * sy);
          }
          ctx.stroke();
        } else if (stroke.type === "arrow") {
          drawArrow(ctx,
            stroke.from.x * sx, stroke.from.y * sy,
            stroke.to.x * sx, stroke.to.y * sy,
            stroke.width * sx
          );
        } else if (stroke.type === "rect") {
          const x = Math.min(stroke.from.x, stroke.to.x) * sx;
          const y = Math.min(stroke.from.y, stroke.to.y) * sy;
          const w = Math.abs(stroke.to.x - stroke.from.x) * sx;
          const h = Math.abs(stroke.to.y - stroke.from.y) * sy;
          ctx.strokeRect(x, y, w, h);
        } else if (stroke.type === "ellipse") {
          const cx = ((stroke.from.x + stroke.to.x) / 2) * sx;
          const cy = ((stroke.from.y + stroke.to.y) / 2) * sy;
          const rx = (Math.abs(stroke.to.x - stroke.from.x) / 2) * sx;
          const ry = (Math.abs(stroke.to.y - stroke.from.y) / 2) * sy;
          ctx.beginPath();
          ctx.ellipse(cx, cy, Math.max(rx, 0.1), Math.max(ry, 0.1), 0, 0, Math.PI * 2);
          ctx.stroke();
        } else if (stroke.type === "diamond") {
          const cx = ((stroke.from.x + stroke.to.x) / 2) * sx;
          const cy = ((stroke.from.y + stroke.to.y) / 2) * sy;
          const hw = (Math.abs(stroke.to.x - stroke.from.x) / 2) * sx;
          const hh = (Math.abs(stroke.to.y - stroke.from.y) / 2) * sy;
          ctx.beginPath();
          ctx.moveTo(cx, cy - hh);
          ctx.lineTo(cx + hw, cy);
          ctx.lineTo(cx, cy + hh);
          ctx.lineTo(cx - hw, cy);
          ctx.closePath();
          ctx.stroke();
        } else if (stroke.type === "line") {
          ctx.beginPath();
          ctx.moveTo(stroke.from.x * sx, stroke.from.y * sy);
          ctx.lineTo(stroke.to.x * sx, stroke.to.y * sy);
          ctx.stroke();
        }
      }

      function drawArrow(ctx, x1, y1, x2, y2, lineW) {
        const angle = Math.atan2(y2 - y1, x2 - x1);
        const headLen = Math.max(10, lineW * 5);

        // Shaft — stop at the base of the arrowhead so it doesn't poke through
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2 - headLen * Math.cos(angle), y2 - headLen * Math.sin(angle));
        ctx.stroke();

        // Head
        ctx.fillStyle = ctx.strokeStyle;
        ctx.beginPath();
        ctx.moveTo(x2, y2);
        ctx.lineTo(
          x2 - headLen * Math.cos(angle - Math.PI / 7),
          y2 - headLen * Math.sin(angle - Math.PI / 7)
        );
        ctx.lineTo(
          x2 - headLen * Math.cos(angle + Math.PI / 7),
          y2 - headLen * Math.sin(angle + Math.PI / 7)
        );
        ctx.closePath();
        ctx.fill();
      }

      /* ── Cursor: classic arrow pointer, hotspot at the tip ── */
      // Perimeter of a standard arrow cursor in unit space (tip at 0,0).
      const CURSOR_POINTS = [
        [0, 0], [0, 17], [3.7, 13.3], [6.0, 18.4],
        [8.1, 17.5], [5.7, 12.5], [10.5, 12.5],
      ];
      const CURSOR_UNIT = 1.4; // display px per unit (~26px tall on canvas)

      function drawCursor(ctx, x, y, scale) {
        const u = CURSOR_UNIT * scale;
        ctx.save();
        ctx.translate(x, y);
        ctx.beginPath();
        ctx.moveTo(CURSOR_POINTS[0][0] * u, CURSOR_POINTS[0][1] * u);
        for (let i = 1; i < CURSOR_POINTS.length; i++) {
          ctx.lineTo(CURSOR_POINTS[i][0] * u, CURSOR_POINTS[i][1] * u);
        }
        ctx.closePath();
        // White body with a soft shadow so it reads on any background…
        ctx.shadowColor = "rgba(0,0,0,0.4)";
        ctx.shadowBlur = 4 * scale;
        ctx.shadowOffsetY = 1 * scale;
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        // …and a crisp dark outline (no shadow on the stroke).
        ctx.shadowColor = "transparent";
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.lineWidth = 1.6 * scale;
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#000000";
        ctx.stroke();
        ctx.restore();
      }

      /* ── Save: composite at full image resolution ── */
      function save() {
        const out = document.createElement("canvas");
        out.width = img.naturalWidth;
        out.height = img.naturalHeight;
        const outCtx = out.getContext("2d");
        outCtx.drawImage(img, 0, 0);

        const sx = img.naturalWidth / drawCanvas.width;
        const sy = img.naturalHeight / drawCanvas.height;

        for (const s of strokes) {
          drawStrokeOnCtx(outCtx, s, sx, sy);
        }

        out.toBlob((blob) => {
          if (!blob) return;
          blob.arrayBuffer().then((buf) => {
            window.annotate.save(new Uint8Array(buf));
          });
        }, "image/png");
      }

      /* ── Crop: flatten annotations into the image, then crop to selection ──
         Cropping commits prior annotations (baked into the new base image) and
         resets the stroke/redo state. */
      function performCrop(sel) {
        const x0 = Math.min(sel.from.x, sel.to.x);
        const y0 = Math.min(sel.from.y, sel.to.y);
        const w0 = Math.abs(sel.to.x - sel.from.x);
        const h0 = Math.abs(sel.to.y - sel.from.y);
        if (w0 < 8 || h0 < 8) { renderDrawCanvas(); return; } // ignore tiny selections

        const sx = img.naturalWidth / drawCanvas.width;
        const sy = img.naturalHeight / drawCanvas.height;

        // Flatten base image + annotations at natural resolution.
        const flat = document.createElement("canvas");
        flat.width = img.naturalWidth;
        flat.height = img.naturalHeight;
        const fctx = flat.getContext("2d");
        fctx.drawImage(img, 0, 0);
        for (const s of strokes) drawStrokeOnCtx(fctx, s, sx, sy);

        // Crop region in natural-pixel coords, clamped to the image.
        let nx = Math.round(x0 * sx);
        let ny = Math.round(y0 * sy);
        let nw = Math.round(w0 * sx);
        let nh = Math.round(h0 * sy);
        nx = Math.max(0, Math.min(nx, flat.width - 1));
        ny = Math.max(0, Math.min(ny, flat.height - 1));
        nw = Math.max(1, Math.min(nw, flat.width - nx));
        nh = Math.max(1, Math.min(nh, flat.height - ny));

        const cropped = document.createElement("canvas");
        cropped.width = nw;
        cropped.height = nh;
        cropped.getContext("2d").drawImage(flat, nx, ny, nw, nh, 0, 0, nw, nh);
        const dataUrl = cropped.toDataURL("image/png");

        // Reset annotation state; the cropped result becomes the new base image.
        strokes = [];
        redoStack = [];
        currentStroke = null;
        calloutCounter = 1;

        img.onload = () => { initCanvas(); selectTool("draw"); };
        img.src = dataUrl;
      }

      /* ── Init canvas to fit available space ── */
      function initCanvas() {
        const area = canvasArea.getBoundingClientRect();
        const pad = 32;
        const maxW = area.width - pad;
        const maxH = area.height - pad;

        const scale = Math.min(1, maxW / img.naturalWidth, maxH / img.naturalHeight);
        const w = Math.round(img.naturalWidth * scale);
        const h = Math.round(img.naturalHeight * scale);

        imageCanvas.width = w;
        imageCanvas.height = h;
        drawCanvas.width = w;
        drawCanvas.height = h;

        imgCtx.drawImage(img, 0, 0, w, h);

        strokeBaseWidth = Math.max(2, Math.round(w / 250));
      }

      /* ── Receive image from main process ── */
      window.annotate.onLoad((data) => {
        if (typeof data.imageDataUrl !== "string" || !data.imageDataUrl.startsWith("data:image/")) return;
        img.onerror = () => console.error("Failed to load annotation image");
        img.onload = () => initCanvas();
        img.src = data.imageDataUrl;
      });
    </script>
  </body>
</html>
