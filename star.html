<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }

      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        height: 100%;
        background: rgba(24, 24, 24, 0.97);
        backdrop-filter: blur(60px) saturate(1.8);
        -webkit-backdrop-filter: blur(60px) saturate(1.8);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 14px;
        padding: 40px 36px 32px;
        font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui,
          sans-serif;
        -webkit-app-region: drag;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5),
          0 4px 16px rgba(0, 0, 0, 0.3);
        opacity: 0;
        transform: translateY(8px) scale(0.97);
        animation: cardIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.1s
          forwards;
      }

      @keyframes cardIn {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .close-btn {
        -webkit-app-region: no-drag;
        position: absolute;
        top: 12px;
        right: 12px;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        cursor: pointer;
      }

      .close-btn:hover svg {
        stroke: rgba(255, 255, 255, 0.8);
      }

      .close-btn svg {
        width: 10px;
        height: 10px;
        stroke: rgba(255, 255, 255, 0.5);
        stroke-width: 2;
        stroke-linecap: round;
      }

      .icon {
        width: 40px;
        height: 40px;
        margin-bottom: 16px;
      }

      h1 {
        font-size: 20px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.95);
        letter-spacing: -0.01em;
        margin-bottom: 8px;
        text-align: center;
      }

      .subtitle {
        font-size: 13px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.5);
        text-align: center;
        margin-bottom: 28px;
      }

      .btn {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 11px 0;
        border: none;
        border-radius: 8px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.1s ease;
        background: #af226b;
        color: #fff;
        letter-spacing: 0.01em;
      }

      .btn:hover {
        background: #921c5a;
      }

      .btn:active {
        transform: scale(0.98);
      }

      .btn svg {
        width: 16px;
        height: 16px;
        fill: #fff;
      }

      .hint {
        -webkit-app-region: no-drag;
        margin-top: 14px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.3);
      }

      .hint a {
        color: rgba(255, 255, 255, 0.4);
        text-decoration: none;
        cursor: pointer;
      }

      .hint a:hover {
        color: rgba(255, 255, 255, 0.6);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="close-btn" id="btn-close">
        <svg viewBox="0 0 14 14" fill="none">
          <path d="M1 1l12 12M13 1L1 13" />
        </svg>
      </div>
      <img class="icon" src="icons/icon-128.png" alt="QGN" />
      <h1>Enjoying QGN?</h1>
      <p class="subtitle">
        It&rsquo;s free and open source. A quick star on GitHub helps more
        people discover it &mdash; and it really makes my day.
      </p>

      <button class="btn" id="btn-star">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 2.5l2.9 5.88 6.49.94-4.7 4.58 1.11 6.46L12 17.77l-5.8 3.05 1.11-6.46-4.7-4.58 6.49-.94L12 2.5z"
          />
        </svg>
        Star on GitHub
      </button>
      <p class="hint"><a id="link-later">Maybe later</a></p>
    </div>

    <script>
      document.getElementById("btn-star").addEventListener("click", () => {
        window.starAPI.star();
      });
      document.getElementById("btn-close").addEventListener("click", () => {
        window.starAPI.dismiss();
      });
      document.getElementById("link-later").addEventListener("click", () => {
        window.starAPI.dismiss();
      });
    </script>
  </body>
</html>
